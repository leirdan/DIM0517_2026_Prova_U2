on:
  pull_request:
    branches: [ desenvolvimento ]
    types: [ closed ]

name: Java

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B compile

      - name: Create tag
        if: success()
        env:
          TAG: build-${{ github.run_id }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
