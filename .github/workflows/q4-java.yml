on:
  workflow_dispatch:

name: Java

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build 
        run: mvn -B compile 

      - name: Unit tests
        run: mvn -B test 

      - name: Build image
        run: docker build -t java-api

      - name: Run container
        run: docker run --detach --name java-api -p 8080:8080 java-api
