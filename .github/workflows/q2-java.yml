on:
  pull_request:
    branches: [ desenvolvimento ]
    types: [ closed ]

name: Java

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B compile

      - name: Test
        run: mvn test 

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Unit tests
        run: mvn test
      - name: If failed earlier
        if: failure()
        run: echo "Workflow falhou"