on:
  pull_request:
    types: [ merged ]
    branches: [ desenvolvimento ]

name: Java

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B compile

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Unit tests
        run: mvn test
        if: failure()
        run: echo "Workflow falhou"